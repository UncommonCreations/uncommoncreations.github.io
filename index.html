<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A Message From the Universe | Uncommon Creations</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#221039,#050509 65%);color:#fff2df;font-family:Georgia,serif;text-align:center;min-height:100vh}main{max-width:680px;margin:auto;padding:30px 16px}h1{font-size:clamp(32px,7vw,52px);font-weight:normal;color:#f4d7a0;margin:12px 0}p{line-height:1.6}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:24px 0}button{cursor:pointer;font:inherit;color:inherit} .heart{background:none;border:0;position:relative;aspect-ratio:1;min-width:0;transition:transform .2s}.heart:hover,.heart:focus-visible{transform:scale(1.08);outline:2px solid #e9c985;border-radius:20px}.heart svg{width:100%;height:100%;overflow:visible}.symbol{position:absolute;top:39%;left:50%;transform:translate(-50%,-50%);font-size:clamp(25px,7vw,49px);filter:drop-shadow(0 0 7px #ffffff66)}#result{border:1px solid #b89a65;border-radius:24px;padding:25px;background:#100b1f;margin:24px 0}#result h2{color:#f4d7a0;font-size:28px} .action{background:#34204d;border:1px solid #c9ab77;border-radius:22px;padding:12px 20px;margin:6px}footer{letter-spacing:3px;font-size:12px;color:#d5b77d;margin-top:35px}small{color:#b7a9c5} [hidden]{display:none!important}</style><main><div style="color:#ddbc82;letter-spacing:10px">✦ ☾ ✧ ☽ ✦</div><h1>Choose a Heart</h1><p>The universe has a message for you.</p><p><i>Trust your intuition. Which heart is calling to you?</i></p><div class="grid" id="hearts"></div><section id="result" hidden aria-live="polite"><div id="chosen" style="font-size:58px"></div><h2 id="heading"></h2><p id="message"></p><p><i id="affirmation"></i></p><button class="action" id="copy">Copy my message</button><button class="action" id="again">Choose again</button><div id="status" role="status"></div></section><small>Return to Facebook and comment which symbol you chose!</small><footer>🍄 UNCOMMON CREATIONS</footer><p><small>For reflection and inspiration.</small></p></main><script>const data=[['🌿','Burning Sage','Release & renewal','You do not have to carry everything that once mattered. Make room for what brings you peace. Letting go can be an act of love.','I release what no longer serves me.','#55f2a6','#b690ff'],['🍄','Mushroom Cluster','Quiet growth','Not all growth is visible. Even when life seems still, something meaningful may be taking root beneath the surface.','I honor my own pace.','#ffb15e','#e06cff'],['☾','Crescent Moon','Trust your intuition','You do not need to see the entire path to take your next step. Give yourself a little quiet and listen to what matters to you.','I trust myself to find my way.','#819aff','#df6aff'],['🦋','Butterfly','New beginnings','You are allowed to outgrow old versions of yourself. Change does not erase who you were; it makes room for who you are becoming.','I welcome change with an open heart.','#ff69b5','#a291ff'],['💎','Amethyst Crystal','Inner peace','You deserve moments of stillness that ask nothing of you. Protect your peace without feeling the need to explain it.','My peace is worth protecting.','#b45cff','#54d5ff'],['🪶','Feather','Gentle reassurance','You do not have to solve everything today. Small steps and gentle choices count, even when nobody else notices.','I give myself permission to rest.','#52f4ef','#f4aaff'],['🗝️','Ancient Key','Possibility','The next chapter does not have to resemble the last. Stay curious about the doors you have not yet tried.','I am open to new possibilities.','#ffce64','#f37aff'],['🌳','Tree of Life','Grounding & resilience','Your roots are made of everything you have learned and lived through. Take time to nourish yourself as generously as you nourish others.','I am grounded, growing and worthy of care.','#83e85e','#42bcff'],['🐦‍🔥','Phoenix','Rebirth & personal power','Your past is part of your story, not the limit of it. You can begin again without apologizing for the person you have become.','I rise with courage and compassion.','#ff744b','#e85dff']];const grid=document.querySelector('#hearts'),result=document.querySelector('#result');let selected;data.forEach((d,i)=>{const b=document.createElement('button');b.className='heart';b.setAttribute('aria-label',d[1]);b.innerHTML=`<svg viewBox="0 0 120 115" aria-hidden="true"><defs><radialGradient id="g${i}" cx="50%" cy="42%" r="66%"><stop offset="0" stop-color="#090710"/><stop offset=".5" stop-color="#141020"/><stop offset=".78" stop-color="${d[5]}" stop-opacity=".55"/><stop offset=".92" stop-color="${d[4]}"/><stop offset="1" stop-color="#100d19"/></radialGradient><linearGradient id="l${i}" x2="1" y2="1"><stop stop-color="${d[4]}"/><stop offset=".5" stop-color="${d[5]}"/><stop offset="1" stop-color="${d[4]}"/></linearGradient></defs><path d="M60 104 C48 90 8 67 8 35 C8 4 43 0 60 25 C77 0 112 4 112 35 C112 67 72 90 60 104Z" fill="url(#g${i})" stroke="url(#l${i})" stroke-width="1.5" style="filter:drop-shadow(0 0 5px ${d[5]})"/><ellipse cx="30" cy="19" rx="12" ry="4" transform="rotate(-25 30 19)" fill="white" opacity=".48"/></svg><span class="symbol">${d[0]}</span>`;b.onclick=()=>{selected=d;document.querySelector('#chosen').textContent=d[0];document.querySelector('#heading').textContent=d[1]+' — '+d[2];document.querySelector('#message').textContent=d[3];document.querySelector('#affirmation').textContent=d[4];document.querySelector('#status').textContent='';grid.hidden=true;result.hidden=false;result.scrollIntoView({behavior:'smooth',block:'center'});};grid.appendChild(b)});document.querySelector('#again').onclick=()=>{result.hidden=true;grid.hidden=false;grid.querySelector('button').focus()};document.querySelector('#copy').onclick=async()=>{const t=selected[1]+' — '+selected[2]+'\n'+selected[3]+'\n'+selected[4]+'\n— Uncommon Creations';try{await navigator.clipboard.writeText(t);document.querySelector('#status').textContent='Copied!'}catch{document.querySelector('#status').textContent='Select and copy the message above.'}};</script></html>
